server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhaW5lZGRldmVsb3BlcjEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Route 1: Auth endpoints — PUBLIC (no JWT filter)
        - id: user-service-auth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**

        # Route 2: Protected user/patient/doctor/admin endpoints — JWT required
        - id: user-service-protected
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/patients/**, /api/doctors/**, /api/admin/**
          filters:
            - JwtAuthFilter

        # Route 3: Appointment Service — JWT required
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/appointments/**, /api/slots/**
          filters:
            - JwtAuthFilter

        # Route 4: Prescription Service — JWT required
        - id: prescription-service
          uri: lb://PRESCRIPTION-SERVICE
          predicates:
            - Path=/api/prescriptions/**
          filters:
            - JwtAuthFilter

        # Route 5: Payment Service — JWT required
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**, /api/billing/**
          filters:
            - JwtAuthFilter

        # Route 6: GenAI Service — PUBLIC (AI symptom checker, no auth needed)
        - id: genai-service
          uri: http://genai-service:8090
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Global CORS configuration for React frontend
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
