spring.application.name=HealthCare-Backend

# ==================================
# DATABASE (JPA/HIBERNATE)
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/healthcaredb?sessionVariables=FOREIGN_KEY_CHECKS=0
spring.datasource.username=root
spring.datasource.password=NewStrongPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==================================
# CUSTOM APP SETTINGS
# ==================================
# JWT Secret
app.jwt.secret=aVeryLongAndSecureSecretKeyForYourApplicationThatShouldBeKeptSafe

# Admin credentials
# app.admin.email=admin@healthcare.com
#admin@123
# app.admin.password=$2a$12$BfeeXdQipSLkqn1apTEHuusduWzhVEUoguKN3SGahJDdNQR4UuvYW

# Jackson (JSON) settings
spring.jackson.mapper.accept-case-insensitive-enums=true

# ==================================
# OAUTH2 / GOOGLE LOGIN
# ==================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend redirect URI after successful OAuth2 login
app.oauth2.redirectUri=http://localhost:5173/oauth2/redirect

# Enable OAuth2 debug logging
logging.level.org.springframework.security.oauth2=DEBUG

# ==================================
# FILE UPLOAD CONFIGURATION
# ==================================
# Profile pictures upload directory (created relative to working directory)
app.file.upload.dir=uploads/profile-pictures/

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Maximum file size validation (in bytes)
app.file.upload.max-size=5242880

