# ============================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================
# Activate this profile: spring.profiles.active=dev

# ==================================
# DATABASE (JPA/HIBERNATE) - DEV
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/healthcaredb?sessionVariables=FOREIGN_KEY_CHECKS=0
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==================================
# LOGGING - DEV (VERBOSE)
# ==================================
logging.level.root=INFO
logging.level.com.ankit.HealthCare_Backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================================
# CUSTOM APP SETTINGS - DEV
# ==================================
# JWT Secret - Set via environment variable: JWT_SECRET
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}

# JWT Expiry (ms) — 86400000 = 24 hours
app.jwt.expiration-ms=86400000

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# Jackson (JSON) settings
spring.jackson.mapper.accept-case-insensitive-enums=true

# ==================================
# OAUTH2 / GOOGLE LOGIN - DEV
# ==================================
# Set via environment variables: OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend redirect URI after successful OAuth2 login (DEV)
app.oauth2.redirectUri=http://localhost:5173/oauth2/redirect
# Backend OAuth2 callback URI (DEV)
app.oauth2.callbackUri=http://localhost:8080/api/auth/oauth2/callback

# CORS allowed origins (DEV - allow localhost)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==================================
# FILE UPLOAD CONFIGURATION - DEV
# ==================================
# Profile pictures upload directory (created relative to working directory)
app.file.upload.dir=uploads/profile-pictures/

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Maximum file size validation (in bytes)
app.file.upload.max-size=5242880

# ==================================
# EMAIL / SMTP CONFIGURATION - DEV
# ==================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-dev-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==================================
# SERVER CONFIGURATION - DEV
# ==================================
server.port=8080
server.servlet.context-path=/
