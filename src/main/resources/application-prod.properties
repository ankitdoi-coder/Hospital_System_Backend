# ============================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ============================================
# Activate this profile: spring.profiles.active=prod

# ==================================
# DATABASE (JPA/HIBERNATE) - PROD
# ==================================
# Must be set via environment variables for security
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ==================================
# LOGGING - PROD (MINIMAL)
# ==================================
logging.level.root=WARN
logging.level.com.ankit.HealthCare_Backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==================================
# CUSTOM APP SETTINGS - PROD
# ==================================
# JWT Secret - MUST be set via environment variable
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}

# JWT Expiry (ms) — 86400000 = 24 hours
app.jwt.expiration-ms=86400000

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# Jackson (JSON) settings
spring.jackson.mapper.accept-case-insensitive-enums=true

# ==================================
# OAUTH2 / GOOGLE LOGIN - PROD
# ==================================
# Must be set via environment variables
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend redirect URI after successful OAuth2 login (PROD)
app.oauth2.redirectUri=${OAUTH_REDIRECT_URI:https://yourdomain.com/oauth2/redirect}
# Backend OAuth2 callback URI (PROD)
app.oauth2.callbackUri=${OAUTH_CALLBACK_URI:https://api.yourdomain.com/api/auth/oauth2/callback}

# CORS allowed origins (PROD - restrict to your domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}

# ==================================
# FILE UPLOAD CONFIGURATION - PROD
# ==================================
# Profile pictures upload directory (should be external storage in production)
app.file.upload.dir=${FILE_UPLOAD_DIR:/var/www/uploads/profile-pictures/}

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Maximum file size validation (in bytes)
app.file.upload.max-size=5242880

# ==================================
# EMAIL / SMTP CONFIGURATION - PROD
# ==================================
# For production, consider using SendGrid or AWS SES
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==================================
# SERVER CONFIGURATION - PROD
# ==================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ==================================
# ACTUATOR / MONITORING - PROD
# ==================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

#Razor Pay
razorpay.key=${RAZORPAY_KEY:your_razorpay_key_here}
razorpay.secret=${RAZORPAY_SECRET:your_razorpay_secret_here}