# ============================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================
# Activate this profile: spring.profiles.active=dev

# ==================================
# DATABASE (JPA/HIBERNATE) - DEV
# ==================================

# Default to localhost for when you run it in VS Code, but Docker will override this
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthcaredb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==================================
# LOGGING - DEV (VERBOSE)
# ==================================
logging.level.root=INFO
logging.level.com.ankit.HealthCare_Backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# JWT Secret - Set via environment variable: JWT_SECRET
app.jwt.secret=${JWT_SECRET:Y2hhaW5lZGRldmVsb3BlcjEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}

# JWT Expiry (ms) — 86400000 = 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# Jackson (JSON) settings
spring.jackson.mapper.accept-case-insensitive-enums=true

# ==================================
# OAUTH2 / GOOGLE LOGIN - DEV
# ==================================
# Set via environment variables: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend redirect URI after successful OAuth2 login (DEV)
app.oauth2.redirectUri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
app.oauth2.callbackUri=${OAUTH2_CALLBACK_URI:http://localhost:8080/login/oauth2/code/google}
# The actual backend callback URI is the Spring Security default: http://localhost:8080/login/oauth2/code/google

# CORS allowed origins (DEV - allow localhost)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,healthcare-copilot.netlify.app}




# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Maximum file size validation (in bytes)
app.file.upload.max-size=5242880



# EMAIL / SMTP CONFIGURATION - DEV
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true




# SERVER CONFIGURATION - DEV
server.port=8080
server.servlet.context-path=/



#Razor Pay 
razorpay.key=${RAZORPAY_KEY:your-razorpay-key}
razorpay.secret=${RAZORPAY_SECRET:your-razorpay-secret}



#Clodinary for the CDN Profile Picture Upload
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-cloudinary-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-cloudinary-api-secret}

# ==================================
# REDIS
# ==================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

#Groq
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile