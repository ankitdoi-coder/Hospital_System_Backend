spring.application.name=HealthCare-Backend

# ==================================
# PROFILE-SPECIFIC CONFIGURATION
# ==================================
# Activate profile via environment: spring.profiles.active=dev or prod
# Default to dev if no profile is specified
spring.profiles.default=dev



# Razorpay configuration (set via environment variables or replace placeholders)
razorpay.key=${RAZORPAY_KEY:your_razorpay_key_here}
razorpay.secret=${RAZORPAY_SECRET:your_razorpay_secret_here}
