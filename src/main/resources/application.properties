spring.application.name=HealthCare-Backend


spring.profiles.active=dev
# ==================================
# CUSTOM APP SETTINGS
# ==================================
# JWT
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
app.jwt.expiration-ms=86400000

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# ==================================
# OAUTH2 / GOOGLE LOGIN
# ==================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.oauth2.redirectUri=${OAUTH2_REDIRECT_URI}
app.oauth2.callbackUri=${OAUTH2_CALLBACK_URI}

logging.level.org.springframework.security.oauth2=DEBUG

# ==================================
# CORS
# ==================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ==================================
# FILE UPLOAD
# ==================================
app.file.upload.dir=uploads/profile-pictures/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload.max-size=5242880

# ==================================
# EMAIL / SMTP
# ==================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================================
# RAZORPAY
# ==================================
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# ==================================
# JACKSON
# ==================================
spring.jackson.mapper.accept-case-insensitive-enums=true
