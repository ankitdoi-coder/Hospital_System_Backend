version: '3.8'

services:
  # ==========================================
  # Infrastructure: MySQL 8.0 Database
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: healthcare_mysql
    environment:
      MYSQL_DATABASE: healthcaredb
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - healthcare-network

  # ==========================================
  # Infrastructure: Redis In-Memory Cache
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-network

  # ==========================================
  # Core: Eureka Service Discovery Registry
  # ==========================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: healthcare_eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - healthcare-network

  # ==========================================
  # Microservice: User & Identity Service
  # ==========================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: healthcare_user_service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/healthcaredb?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secretpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-Y2hhaW5lZGRldmVsb3BlcjEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - healthcare-network

  # ==========================================
  # Microservice: Appointment Service
  # ==========================================
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: healthcare_appointment_service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/healthcaredb?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secretpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - healthcare-network

  # ==========================================
  # Ingress: Spring Cloud API Gateway
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: healthcare_api_gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      appointment-service:
        condition: service_started
    networks:
      - healthcare-network

  # ==========================================
  # Microservice: GenAI Service (FastAPI)
  # ==========================================
  genai-service:
    build:
      context: ./genai-service
      dockerfile: Dockerfile
    container_name: healthcare_genai_service
    ports:
      - "8090:8090"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
